[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aliasr"
version = "1.1.4"
description = "Modern TUI launcher for pentest commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual==8.2.8",
    "textual-autocomplete>=4.0.5",
    "pyperclip>=1.9.0",
]

[project.scripts]
aliasr = "aliasr.__main__:main"

[dependency-groups]
dev = [
    "textual-dev>=1.7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyinstrument>=5.1.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
# `arun` is a plain shell wrapper (not a Python entry point), shipped into the
# wheel's .data/scripts/. uv tool and pipx link every executable the package
# installs -- data scripts included -- onto PATH next to the `aliasr` shim, so
# `arun` installs/updates/uninstalls with the package, no runtime bootstrap.
script-files = ["scripts/arun"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aliasr*"]

[tool.setuptools.package-data]
aliasr = [
    "tui/*.tcss",
    "data/**/*",
]
