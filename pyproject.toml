[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aliasr"
version = "1.0.1"
description = "Modern TUI launcher for pentest commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual==8.2.8",
    "textual-autocomplete>=4.0.5",
    "pykeepass>=4.0.0",
    "pyperclip>=1.9.0",
]

[project.scripts]
aliasr = "aliasr.__main__:main"

[dependency-groups]
dev = [
    "textual-dev>=1.7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aliasr*"]

[tool.setuptools.package-data]
aliasr = [
    "tui/*.tcss",
    "data/**/*",
]
