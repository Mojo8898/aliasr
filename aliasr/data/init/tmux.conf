# aliasr extended tmux integration.
# prefix+K opens aliasr below the current pane and sends the command to the
# previously focused pane (executing it); prefix+U does so without the Enter.
bind U split-window "aliasr send -pp"
bind K split-window "aliasr -e send -pp"

# Recommended tmux settings.
set -s escape-time 0
set -s focus-events on
set -s default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
