# DEFAULT PACKAGE CONFIGS
## REMOVING ANY OF THESE VALUES WILL RAISE ERRORS
### EDIT ~/.aliasr/config.toml INSTEAD AND CHANGES WILL AUTOMATICALLY BE MERGED
[cheats]
paths = ["~/.cheats", "/opt/my-resources/setup/arsenal-cheats"]
exclude = ["README.md"]
include_defaults = true
custom_first = false
default_grouping = "cat"  # Set to "" for none/all

[globals]
path = "globals.json"
history = true
max_len = 50
show_grid = true
auto_krb = false

[globals.defaults]
lhost = [""]
lport = [""]
lwport = ["8000"]  # Yes I made this up. Stands for "local web port" and is where you serve your simple http server
ip = [""]
hostname = [""]
domain = [""]
fqdn = [""]
dc_ip = [""]
dc_fqdn = [""]
domain_sid = [""]
krb5ccname = [""]
aliasr_prefix = [""]

[creds]
db = "~/.exegol_history/exh.db"
profile = ""  # exegol-history profile.sh; "" auto-detects from ~/.exegol_history/config.toml
mask = false
auto_hash = true
confirm_delete = true  # Prompt before deleting a row in the creds/hosts menu; set false for one-key delete

[nxc]
# NetExec (nxcdb) integration. Credentials and hosts NetExec discovers are
# pulled into aliasr on startup, and deleting one in the creds/hosts menu
# deletes it from the NetExec database too.
# block_bulk_delete guards only the `aliasr clear creds/hosts/all` commands,
# which delete with no per-item prompt: leave it false to let a clear also empty
# NetExec, or set it true to stop those clear commands from touching NetExec.
# Deleting a credential or host from the menu is a separate, individually
# confirmed action and always propagates to NetExec, regardless of this setting.
block_bulk_delete = false

[keybindings]
quit = "ctrl+c"
copy_input = "ctrl+b"
prev_tab = "alt+left"
next_tab = "alt+right"
toggle_grid = "ctrl+g"  # While focusing the search bar
cycle_grid_focus = "ctrl+s"
cycle_filter_focus = "ctrl+r"
cycle_select_focus = "ctrl+y"  # Refers to dropdown boxes in top right of main screen
globals_editor = "ctrl+g"  # While focusing the globals grid
globals_screen = "ctrl+o"
creds_screen = "ctrl+l"

[keybindings.build_screen]
param_screen = "ctrl+r"
variations_screen = "ctrl+g"

[keybindings.grid_nav]
move_left = "alt+left"
move_right = "alt+right"
move_up = "alt+up"
move_down = "alt+down"

[keybindings.table]
edit_row = "enter"
add_row = "ctrl+n"
delete_row = "ctrl+j"  # Terminals also send this for Ctrl+Enter; the creds/hosts delete prompt guards against an accidental trigger
move_row_up = "ctrl+up"
move_row_down = "ctrl+down"

[keybindings.table.copy]
col_1 = "ctrl+r"  # Username/Global
col_2 = "ctrl+t"  # Password/Value
col_3 = "ctrl+y"  # NT Hash
col_4 = "ctrl+g"  # Domain

[build]
# Separator run before each command in a multi-command cheat, announcing the
# command about to execute. It becomes a shell function `s` invoked as
# `s '<command>'`, so "$1" is the command text. Bash/sh only.
separator = "if [ -t 1 ]; then printf '\\n\\033[1;36m=== %s ===\\033[0m\\n' \"$1\"; else printf '\\n=== %s ===\\n' \"$1\"; fi"

[layout]
globals_rows = 2
globals_columns = 6
build_columns = 5

# See https://textual.textualize.io/guide/design/#base-colors for reference
[theme]
name = "aliasr"
primary = "#61AFEF"
secondary = "#C678DD"
accent = "#56B6C2"
foreground = "#DCDFE4"
background = "#282C34"
success = "#98C379"
warning = "#E5C07B"
error = "#E06C75"
surface = "#282C34"
panel = "#282C34"
dark = true
footer_key_foreground = "#61AFEF"
